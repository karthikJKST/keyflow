  <g fill="#FFFFFF">
    <circle cx="9" cy="48" r="3.1" opacity="0.55"/>
    <circle cx="16" cy="43" r="3.1" opacity="0.65"/>
    <circle cx="23" cy="38" r="3.1" opacity="0.75"/>
    <circle cx="30" cy="33" r="3.5" opacity="1"/>
    <circle cx="38" cy="28" r="3.5" opacity="1"/>
    <circle cx="45" cy="23" r="3.1" opacity="0.75"/>
    <circle cx="52" cy="18" r="3.1" opacity="0.65"/>
    <circle cx="59" cy="13" r="3.1" opacity="0.55"/>
  </g>
</svg>
