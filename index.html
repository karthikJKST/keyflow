<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F7F8FC" />
    <meta name="description" content="A focused touch-typing trainer for building muscle memory with the eight home-row keys." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>KeyFlow — Home Row Touch-Typing Trainer</title>
    <script>
      // Resolve the theme before first paint: saved preference first,
      // otherwise follow the operating system's color scheme.
      (function () {
        var theme = null
        try {
          theme = localStorage.getItem('keyflow.theme')
        } catch (e) {
          theme = null
        }
        if (theme !== 'light' && theme !== 'dark') {
          theme =
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
        }
        document.documentElement.setAttribute('data-theme', theme)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
